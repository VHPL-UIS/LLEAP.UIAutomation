name: Build

on:
	push:
	pull_request:

permissions:
	contents: read

jobs:
	build:
		runs-on: windows-latest

		steps:
			- uses: actions/checkout@v6
			- uses: actions/setup-dotnet@v5
			  with:
			    dotnet-version: "10.0.x"

			- run: dotnet restore LLEAP.UITests.slnx

			- run: > 
			    dotnet build LLEAP.UITests.slnx
				--configuration Release
				--no-restore